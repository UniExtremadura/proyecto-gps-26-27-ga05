services:
  mongodb:
    image: mongo:7
    container_name: subsonic-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: subsonic
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
    name: subsonic-mongo-data
