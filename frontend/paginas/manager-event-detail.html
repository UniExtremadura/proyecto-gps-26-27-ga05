<!-- DETALLE / EDICIÓN DE EVENTO -->
<section class="detail-page">
    <a class="back-link" href="#manager-events" data-page="manager-events">← Volver a festivales</a>

    <header class="detail-header">
        <p class="manager-eyebrow">GESTIÓN DE EVENTOS</p>
        <h1 id="eventDetailTitle">Evento</h1>
    </header>

    <div class="detail-card">
        <form id="eventDetailForm" class="manager-form-grid">
            <input id="eventDetailId" type="hidden">

            <div class="form-group full-width">
                <label for="eventDetailName">Nombre del festival</label>
                <input id="eventDetailName" type="text" required>
            </div>
            <div class="form-group">
                <label for="eventDetailDate">Fecha</label>
                <input id="eventDetailDate" type="date" required>
            </div>
            <div class="form-group">
                <label for="eventDetailLocation">Ubicación</label>
                <input id="eventDetailLocation" type="text" required>
            </div>
            <div class="form-group">
                <label for="eventDetailGenre">Género</label>
                <input id="eventDetailGenre" type="text">
            </div>
            <div class="form-group">
                <label for="eventDetailPrice">Precio de entrada (€)</label>
                <input id="eventDetailPrice" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="form-group">
                <label for="eventDetailTickets">Entradas disponibles</label>
                <input id="eventDetailTickets" type="number" min="0" value="0">
            </div>
            <div class="form-group full-width">
                <label for="eventDetailDescription">Descripción</label>
                <textarea id="eventDetailDescription" rows="5"></textarea>
            </div>

            <div class="form-actions full-width">
                <span id="eventDetailStatus" class="form-message"></span>
                <div class="detail-actions">
                    <button id="eventDetailDelete" class="btn btn-outline danger hidden" type="button">ELIMINAR</button>
                    <button id="eventDetailSubmit" class="btn btn-primary" type="submit">GUARDAR CAMBIOS</button>
                </div>
            </div>
        </form>
    </div>
</section>
