<!-- TK-005-2: formulario de reinicio de contraseña -->
<div class="reset-page">
    <div class="reset-card">
        <h1>RECUPERAR CONTRASEÑA</h1>
        <p class="reset-subtitle">Introduce tu correo y te enviaremos un enlace para restablecer la contraseña.</p>

        <div class="reset-step" id="resetRequestStep">
            <label for="reset-email">Correo electrónico</label>
            <input id="reset-email" type="email" placeholder="tu@email.com" />
            <button id="reset-request-btn" type="button">ENVIAR ENLACE</button>
        </div>

        <div class="reset-step hidden" id="resetConfirmStep">
            <p class="reset-demo-token" id="reset-demo-token"></p>
            <label for="reset-token">Token de recuperación</label>
            <input id="reset-token" type="text" placeholder="Pega el token recibido" />
            <label for="reset-password">Nueva contraseña</label>
            <input id="reset-password" type="password" placeholder="Mínimo 8 caracteres, una mayúscula y un número" />
            <button id="reset-confirm-btn" type="button">CAMBIAR CONTRASEÑA</button>
        </div>

        <p id="reset-status" class="reset-status"></p>
        <a href="#login" class="reset-back">← Volver al inicio de sesión</a>
    </div>
</div>
