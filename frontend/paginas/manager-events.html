<!-- NAVBAR -->
    

    <!-- PANEL HEADER -->
    <header class="events-panel-header">
        <div class="header-content">
            <h1>FESTIVALES SUBSONIC</h1>
            <p>Gestiona la programación y el aforo del festival.</p>
        </div>
        <button class="btn-new-event">+ NUEVO EVENTO</button>
    </header>

    <!-- TK-008-2: formulario rápido de creación/edición de eventos -->
    <section class="quick-event-panel">
        <h2>Crear / editar evento</h2>
        <div class="quick-event-grid">
            <input id="quickEventName" type="text" placeholder="Nombre del festival" />
            <input id="quickEventDate" type="date" />
            <input id="quickEventLocation" type="text" placeholder="Ciudad / recinto" />
            <input id="quickEventPrice" type="number" min="0" step="0.01" placeholder="Precio entrada" />
            <input id="quickEventTickets" type="number" min="0" placeholder="Aforo disponible" />
            <input id="quickEventId" type="hidden" />
            <button id="quickEventSave" type="button">GUARDAR EVENTO</button>
        </div>
        <p id="quickEventStatus" class="quick-event-status"></p>
    </section>

    <!-- FILTROS AVANZADOS -->
    <section class="filters-advanced">
        <h2 style="color: #fff; font-size: 1.4rem; font-weight: 700; padding: 1rem 2.5rem 0.5rem 2.5rem; margin: 0;">Filtros</h2>
        <div class="filters-container-advanced">
            <!-- Intervalo de Fechas -->
            <div class="filter-section filter-dates">
                <label>📅 Fechas</label>
                <div class="date-range-inputs">
                    <input type="date" id="dateStart" class="date-input" />
                    <span class="date-separator">→</span>
                    <input type="date" id="dateEnd" class="date-input" />
                </div>
            </div>

            <!-- Filtro de Ciudades -->
            <div class="filter-section filter-cities">
                <label>🏙️ Ciudades</label>
                <div class="city-search-container">
                    <input type="text" id="citySearch" class="city-search-input" placeholder="Buscar ciudad..." />
                    <div id="citySuggestions" class="city-suggestions" style="display:none;"></div>
                </div>
                <div id="selectedCities" class="selected-cities"></div>
            </div>

            <!-- Filtros Seleccionados -->
            <div class="filter-section filter-active">
                <label>Filtros Seleccionados</label>
                <div id="activeFiltersDisplay" class="active-filters-display"></div>
            </div>

            <!-- Limpiar Filtros -->
            <div class="filter-section filter-clear">
                <button id="clearAllFilters" class="clear-all-btn">Limpiar</button>
            </div>
        </div>
    </section>

    <!-- EVENTS GRID -->
    <section class="events-grid" id="eventsGrid">
        <!-- Events will be injected here -->
    </section>
