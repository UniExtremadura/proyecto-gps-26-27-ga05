<!-- HEADER EVENTOS -->
<header class="events-header">
    <div class="events-header-content">
        <p class="events-eyebrow">SUBSONIC FESTIVAL</p>
        <h1>PRÓXIMOS FESTIVALES</h1>
        <p>Descubre la programación, consulta ubicaciones y compra tus entradas.</p>
    </div>
    <a class="btn btn-outline" href="#artistas" data-page="artistas">VER ARTISTAS</a>
</header>

<section class="events-controls">
    <input type="search" id="eventsSearch" placeholder="Buscar festival, ciudad o género...">
    <select id="eventsGenre">
        <option value="">Todos los géneros</option>
        <option value="indie">Indie</option>
        <option value="electrónica">Electrónica</option>
        <option value="rock">Rock</option>
        <option value="pop">Pop</option>
        <option value="hip hop">Hip Hop</option>
    </select>
</section>

<section class="events-grid" id="eventsGrid">
    <p class="loading-state">Cargando festivales...</p>
</section>
