<!-- GESTIÓN DE TIENDA -->
<header class="manager-header">
    <div>
        <p class="manager-eyebrow">GESTIÓN DE MERCHANDISING</p>
        <h1>TIENDA</h1>
        <p>Crea, edita y elimina los productos oficiales del festival.</p>
    </div>
    <a class="btn btn-outline" href="#manager-profile" data-page="manager-profile">MI PERFIL</a>
</header>

<section class="manager-panel">
    <div class="manager-form-card">
        <h2>Producto</h2>
        <form id="productManagerForm" class="manager-form-grid">
            <input id="productId" type="hidden">
            <div class="form-group">
                <label for="productName">Nombre</label>
                <input id="productName" type="text" placeholder="Camiseta oficial" required>
            </div>
            <div class="form-group">
                <label for="productCategory">Categoría</label>
                <input id="productCategory" type="text" placeholder="Ropa" list="productCategories">
                <datalist id="productCategories">
                    <option value="Ropa"></option>
                    <option value="Accesorios"></option>
                    <option value="Coleccionables"></option>
                    <option value="Varios"></option>
                </datalist>
            </div>
            <div class="form-group">
                <label for="productPrice">Precio (€)</label>
                <input id="productPrice" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="form-group">
                <label for="productStock">Stock</label>
                <input id="productStock" type="number" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="productMinStock">Stock mínimo</label>
                <input id="productMinStock" type="number" min="0" value="5">
            </div>
            <div class="form-group full-width">
                <label for="productImage">Imagen (URL o ruta)</label>
                <input id="productImage" type="text" placeholder="./assets/img/camiseta.svg">
            </div>
            <div class="form-group full-width">
                <label for="productDescription">Descripción</label>
                <textarea id="productDescription" rows="3" placeholder="Descripción del producto..."></textarea>
            </div>
            <div class="form-actions full-width">
                <span id="productManagerStatus" class="form-message"></span>
                <button type="submit" class="btn btn-primary">GUARDAR PRODUCTO</button>
            </div>
        </form>
    </div>

    <div class="manager-list-card">
        <h2>Catálogo</h2>
        <div id="managerProductsGrid" class="manager-grid">
            <p class="loading-state">Cargando productos...</p>
        </div>
    </div>
</section>
