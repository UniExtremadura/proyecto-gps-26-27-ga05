<!-- DETALLE / EDICIÓN DE PRODUCTO -->
<section class="detail-page">
    <a class="back-link" href="#manager-tienda" data-page="manager-tienda">← Volver a la tienda</a>

    <header class="detail-header">
        <p class="manager-eyebrow">GESTIÓN DE MERCHANDISING</p>
        <h1 id="productDetailTitle">Producto</h1>
    </header>

    <div class="detail-card">
        <form id="productDetailForm" class="manager-form-grid">
            <input id="productDetailId" type="hidden">

            <div class="form-group full-width">
                <label for="productDetailName">Nombre</label>
                <input id="productDetailName" type="text" required>
            </div>
            <div class="form-group">
                <label for="productDetailCategory">Categoría</label>
                <input id="productDetailCategory" type="text">
            </div>
            <div class="form-group">
                <label for="productDetailPrice">Precio (€)</label>
                <input id="productDetailPrice" type="number" min="0" step="0.01" value="0">
            </div>
            <div class="form-group">
                <label for="productDetailStock">Stock</label>
                <input id="productDetailStock" type="number" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="productDetailMinStock">Stock mínimo</label>
                <input id="productDetailMinStock" type="number" min="0" value="5">
            </div>
            <div class="form-group full-width">
                <label for="productDetailImage">Imagen (URL o ruta)</label>
                <input id="productDetailImage" type="text">
            </div>
            <div class="form-group full-width">
                <label for="productDetailDescription">Descripción</label>
                <textarea id="productDetailDescription" rows="5"></textarea>
            </div>

            <div class="form-actions full-width">
                <span id="productDetailStatus" class="form-message"></span>
                <div class="detail-actions">
                    <button id="productDetailDelete" class="btn btn-outline danger" type="button">ELIMINAR</button>
                    <button id="productDetailSubmit" class="btn btn-primary" type="submit">GUARDAR CAMBIOS</button>
                </div>
            </div>
        </form>
    </div>
</section>
